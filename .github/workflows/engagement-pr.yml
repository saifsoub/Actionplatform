name: Engagement PR verification

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/engagement-pr.yml"
  push:
    branches:
      - "cursor/engagement-monitoring-workflow-27a6"
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/engagement-pr.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      PROJECT_NAME: Actionplatform CI
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: test-password
      SECRET_KEY: test-secret-key-that-is-long-enough-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run alembic upgrade heads
      - run: uv run pytest tests/api/routes/test_engagement.py
      - run: uv run ruff check app/api/routes/engagement.py tests/api/routes/test_engagement.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Type-check engagement component
        run: >-
          bunx tsc --noEmit --jsx react-jsx --moduleResolution bundler
          --module esnext --target es2022 --skipLibCheck --types vite/client
          src/components/Engagement/index.tsx
      - run: bunx biome check --no-errors-on-unmatched --files-ignore-unknown=true src/components/Engagement/index.tsx
