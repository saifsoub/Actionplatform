name: GitHub Native Run

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - ci/github-native-run

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run build

  backend:
    name: Backend import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PROJECT_NAME: Actionplatform
      STACK_NAME: actionplatform
      SECRET_KEY: github-actions-only-secret-key
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: github-actions-only-password
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install backend dependencies
        run: uv sync
      - name: Import FastAPI application
        run: uv run python -c "from app.main import app; print(app.title); print(len(app.routes))"
